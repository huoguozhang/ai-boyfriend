    <!-- 脸 -->
    <ellipse cx="50" cy="55" rx="20.5" ry="23" fill="#ffe2d2"/>
    <!-- 刘海 -->
    <path d="M50 24c-13 0-21 8-23 20 5-6 12-9 23-9s18 3 23 9c-2-12-10-20-23-20z" fill="#3a2a2d"/>
    <!-- 眉毛 -->
    <path d="M38 49.5c1.6-1.4 4.4-1.4 6 0M56 49.5c1.6-1.4 4.4-1.4 6 0" stroke="#5a4144" stroke-width="1.3" fill="none" stroke-linecap="round"/>
