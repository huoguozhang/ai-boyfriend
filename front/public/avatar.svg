    <!-- 腮红 -->
    <ellipse cx="35" cy="64" rx="4.6" ry="2.7" fill="#ffaeb6" opacity="0.7"/>
    <ellipse cx="65" cy="64" rx="4.6" ry="2.7" fill="#ffaeb6" opacity="0.7"/>
    <!-- 嘴 -->
