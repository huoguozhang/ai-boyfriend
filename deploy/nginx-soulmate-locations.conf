# 前端静态 + 后端反代，被 80 和 443 两个 server 块共用（单一来源，避免两处漂移）。
# 放在 snippets/ 子目录是有意的：宝塔 include 的是 vhost/nginx/*.conf，
# 只有直接子文件会被当站点加载，子目录里的片段不会。
charset utf-8;
# 语音走 base64 JSON，图片/视频也可能较大
client_max_body_size 32m;

root /opt/soulmate/web;
index index.html;

access_log /www/wwwlogs/soulmate.access.log;
error_log  /www/wwwlogs/soulmate.error.log;

gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# 单页应用：路由是前端管的，找不到文件一律回 index.html
location / {
    try_files $uri $uri/ /index.html;
}

# 带 hash 的构建产物，可以放心长缓存
location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# ---------- 后端 API ----------
# 关 buffering 是硬要求：/api/v1/chat/stream 是 SSE 逐字推送，
# 开着 proxy_buffering 会攒够一个 buffer 才吐，表现为「说完一大段才一起出现」。
location /api/ {
    proxy_pass http://127.0.0.1:6100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    # TTS 整段合成 640 字要约 45s，留足
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
}

# 本地生成的媒体文件（当前是内联 data URI，留一条以防后端改成本地文件）
location /media/ {
    proxy_pass http://127.0.0.1:6100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# ---------- mem0 记忆服务 ----------
# 后端在服务器上直接连 127.0.0.1:6101；这条是给外部调试用的。
location /mem0/ {
    proxy_pass http://127.0.0.1:6101/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 180s;
    proxy_buffering off;
}
