# ai-soulmate：HTTPS 站点（Let's Encrypt 的 IP 证书，公网可信，无警告）
#
# 为什么非要 HTTPS：浏览器只在「安全上下文」（https 或 localhost）里暴露
# navigator.mediaDevices，http 下点「按住说话」直接失败。
#
# 证书来自 Let's Encrypt 的 IP 地址证书（2026-01 起 GA）：
#   - 只能走 shortlived profile，有效期 160 小时（约 6.7 天）
#   - 验证方式只有 http-01 / tls-alpn-01（IP 没有 dns-01），所以下面 80 块留了
#     /.well-known/acme-challenge/ 直线出文件，不能被 301 掉
#   - 自动续期靠 certbot.timer，续完由 renewal-hooks/deploy 重载 nginx
#
# 回退：如果哪天 LE 抽风，把这两行换回 /opt/soulmate/certs/ 下的自签证书即可
# （ca.crt 还在 web 根目录，手机仍可直接安装）。

# ---------- 80：全站跳 HTTPS ----------
server {
    listen 80;
    server_name 101.43.26.29;

    # Let's Encrypt 的 http-01 验证只能走 80，且必须 200（不能被 301 掉）。
    # IP 证书不支持 dns-01，所以这条是必需的。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        access_log off;
    }

    # 例外：/mem0/ 保持明文。本地开发的 server/.env 写的是 http://101.43.26.29/mem0，
    # 一跳转它就会拿证书去校验然后失败。后端自己走 127.0.0.1:6101，不受影响。
    location /mem0/ {
        proxy_pass http://127.0.0.1:6101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    location / { return 301 https://$host$request_uri; }
}

# ---------- 443：主体 ----------
server {
    listen 443 ssl;
    http2 on;
    server_name 101.43.26.29;

    ssl_certificate     /etc/letsencrypt/live/101.43.26.29/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/101.43.26.29/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SoulmateSSL:10m;
    ssl_session_timeout 1h;
    ssl_stapling off;

    # 单一来源：路径/缓存/API 反代都在这里，80 与 443 不重复维护
    include /www/server/panel/vhost/nginx/snippets/soulmate-locations.conf;
}
